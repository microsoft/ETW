name: Rust

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  windows-buildtest:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ./rust/etw_helpers
    steps:
      - uses: actions/checkout@v3
      - name: Build
        run: cargo build --verbose
      - name: Build without std
        # Only the raw consumer: the crate is `no_std` (with `alloc`) without the `std` feature
        run: cargo build --verbose --no-default-features
      - name: Run tests
        # flume isn't a default feature, so enable it (and its async APIs) to test that backend too
        run: cargo test --verbose --features flume-async
  linux-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./rust/etw_helpers
    steps:
      - uses: actions/checkout@v3
      - name: Build
        run: cargo build --verbose

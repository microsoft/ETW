[package]
name = "etw_helpers"
version = "0.1.0"
edition = "2021"
resolver = "3"
license = "MIT"
rust-version = "1.84"
authors = ["Kyle Sabo", "Microsoft"]
repository = "https://github.com/microsoft/etw"

[features]
futures = ["dep:futures"]
crossbeam = ["dep:crossbeam-channel"]
flume = ["dep:flume"]
default = ["futures", "crossbeam", "flume"]

[dependencies]
windows = {version="0.59", features=["Win32_System_Diagnostics_Etw", "Win32_Foundation", "Win32_System_Time"]}
rsevents = "0.3"
futures = {version="0.3", default-features = false, optional=true, features = ["std", "executor"]}
crossbeam-channel = {version="0.5", optional=true, default-features = false, features = ["std"]}
flume = {version="0.11", optional=true, default-features = false, features = ["select"]}

[dev-dependencies]
tokio = {version="1.0", features=["full"]}
tracelogging = ">= 1.2.0"
tracelogging_dynamic = ">= 1.2.0"
futures = {version="0.3"}

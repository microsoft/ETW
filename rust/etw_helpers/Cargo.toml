[package]
name = "etw_helpers"
version = "0.1.0"
edition = "2024"
resolver = "3"
license = "MIT"
rust-version = "1.95"
authors = ["Kyle Sabo", "Microsoft"]
repository = "https://github.com/microsoft/etw"

[features]
# Without `std`, the crate is `no_std` (it needs `alloc`), and only the raw consumer is available.
std = []
futures = ["std", "dep:futures", "dep:futures-timer", "hotpath?/futures"]
crossbeam = ["std", "dep:crossbeam-channel", "hotpath?/crossbeam"]
flume = ["std", "dep:flume", "hotpath?/flume"]
# Async APIs on flume: `event_consumer_flume::EtwEventWaiter::expect_event_async` and `event_consumer_flume_stream`.
flume-async = ["flume", "flume/async", "dep:futures-timer", "dep:futures"]
default = ["std", "futures", "crossbeam"]
# Profiling with hotpath-rs (https://hotpath.rs). Without this feature, the hotpath dependency isn't included at all.
hotpath = ["std", "dep:hotpath", "hotpath/hotpath"]
hotpath-alloc = ["hotpath", "hotpath/hotpath-alloc"]

[dependencies]
futures = {version="0.3", default-features = false, optional=true, features = ["std", "executor"]}
crossbeam-channel = {version="0.5", optional=true, default-features = false, features = ["std"]}
flume = {version="0.12", optional=true, default-features = false}
futures-timer = {version="3.0", optional=true}
hotpath = {version="0.30", optional=true}
windows-sys = { version = "0.61.2", features = ["Win32_System_Diagnostics_Etw", "Win32_Foundation", "Win32_System_Time", "Win32_System_Threading", "Win32_System_Performance"] }

[dev-dependencies]
tokio = {version="1.0", features=["full"]}
tracelogging = ">= 1.2.4"
tracelogging_dynamic = ">= 1.2.4"
futures = {version="0.3"}

[[example]]
name = "profile_crossbeam"
required-features = ["crossbeam"]

[[example]]
name = "profile_flume"
required-features = ["flume"]

[[example]]
name = "profile_raw"

[[example]]
name = "profile_futures"
required-features = ["futures"]

[[example]]
name = "profile_futures_stream"
required-features = ["futures"]

[[example]]
name = "basic_sync"

[[example]]
name = "basic_async"
required-features = ["futures"]

[[example]]
name = "basic_realtime"
